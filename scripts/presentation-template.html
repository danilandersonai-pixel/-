<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="Презентация приложения для персонального тренера «Спортивный Треккер»">
<meta name="theme-color" content="#0C0D0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONTS}}">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #08090A; }
  body { overflow: hidden; font-family: 'Golos Text', Arial, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

  /* Слайд — холст 1920×1080, целиком вписывается в окно */
  .stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .stage > section { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; }
  .stage > section.is-active { opacity: 1; visibility: visible; transition: opacity .35s ease; }
  .stage h1, .stage h2, .stage h3, .stage p, .stage table { margin: 0; }
  .stage h1, .stage h2, .stage h3, .stage p { overflow-wrap: break-word; }
  .stage aside { display: none; }
  .stage img { display: block; flex-shrink: 0; }
  .stage .icon { flex-shrink: 0; }
  .stage a { color: inherit; text-underline-offset: 6px; }
  .stage table { border-collapse: collapse; }
  .stage th, .stage td { padding: .35em .6em; border: 1px solid #DCDDD6; text-align: left; font-weight: 400; }
  .stage th { font-weight: 600; }

  /* Управление */
  .bar { position: fixed; left: 0; bottom: 0; height: 4px; background: #C6F24E; transition: width .35s ease; }
  .controls { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; transition: opacity .3s ease; }
  .controls.is-idle { opacity: .25; }
  .controls button, .counter { height: 44px; border-radius: 12px; border: 1px solid rgba(242, 243, 238, .16); background: rgba(12, 13, 15, .78); color: #F2F3EE; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .controls button { width: 44px; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .controls button:disabled { opacity: .35; cursor: default; }
  .controls button:focus-visible { outline: 2px solid #C6F24E; outline-offset: 2px; }
  .controls svg { width: 20px; height: 20px; }
  .counter { min-width: 76px; padding: 0 12px; display: grid; place-items: center; font: 600 15px/1 'Golos Text', Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .rotate { position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%); display: none; padding: 10px 16px; border-radius: 12px; background: rgba(12, 13, 15, .85); border: 1px solid rgba(242, 243, 238, .16); color: #F2F3EE; font: 500 14px/1.3 'Golos Text', Arial, sans-serif; white-space: nowrap; }
  @media (orientation: portrait) and (max-width: 700px) { .rotate { display: block; } }
  @media (max-height: 500px) {
    .controls { gap: 6px; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); }
    .controls button, .counter { height: 36px; border-radius: 10px; }
    .controls button { width: 36px; }
    .counter { min-width: 64px; font-size: 13px; }
  }

  /* Печать и «Сохранить как PDF»: по слайду на страницу */
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { height: auto; overflow: visible; background: none; }
    .stage { position: static; transform: none !important; height: auto; }
    .stage > section { position: relative; opacity: 1; visibility: visible; break-after: page; }
    .controls, .bar, .rotate { display: none; }
  }
</style>
<noscript><style>
  body { overflow: auto; }
  .stage { position: static; height: auto; }
  .stage > section { position: relative; opacity: 1; visibility: visible; }
  .controls, .bar { display: none; }
</style></noscript>
</head>
<body>
<main class="stage" aria-live="polite">
{{SLIDES}}
</main>

<div class="bar" aria-hidden="true"></div>
<p class="rotate" role="note">Поверните телефон — слайды станут крупнее</p>
<nav class="controls" aria-label="Слайды">
  <button type="button" data-go="prev" aria-label="Предыдущий слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="counter" aria-live="polite">1 / {{TOTAL}}</span>
  <button type="button" data-go="next" aria-label="Следующий слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button type="button" data-go="fullscreen" aria-label="Во весь экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
</nav>

<script>
(function () {
  var stage = document.querySelector('.stage');
  var slides = Array.prototype.slice.call(stage.children);
  var total = slides.length;
  var counter = document.querySelector('.counter');
  var bar = document.querySelector('.bar');
  var controls = document.querySelector('.controls');
  var prevButton = document.querySelector('[data-go="prev"]');
  var nextButton = document.querySelector('[data-go="next"]');
  var fullscreenButton = document.querySelector('[data-go="fullscreen"]');
  var index = 0;

  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var scale = Math.min(w / 1920, h / 1080);
    var x = (w - 1920 * scale) / 2, y = (h - 1080 * scale) / 2;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
  }

  function slideFromHash() {
    var n = parseInt(location.hash.slice(1), 10);
    return isNaN(n) ? 0 : n - 1;
  }

  // Номер слайда хранится в адресе (#3): ссылку можно отправить прямо на нужный слайд
  function show(i, updateHash) {
    index = Math.max(0, Math.min(total - 1, i));
    slides.forEach(function (slide, k) {
      var active = k === index;
      slide.classList.toggle('is-active', active);
      slide.setAttribute('aria-hidden', active ? 'false' : 'true');
      slide.inert = !active;
    });
    counter.textContent = (index + 1) + ' / ' + total;
    bar.style.width = ((index + 1) / total * 100) + '%';
    prevButton.disabled = index === 0;
    nextButton.disabled = index === total - 1;
    if (updateHash) history.replaceState(null, '', '#' + (index + 1));
  }

  function go(step) { show(index + step, true); }

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    // Enter и пробел на кнопке или ссылке — это нажатие на неё, а не переход к следующему слайду
    if ((e.key === ' ' || e.key === 'Enter') && e.target.closest && e.target.closest('button, a')) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') { show(0, true); }
    else if (e.key === 'End') { show(total - 1, true); }
    else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') { toggleFullscreen(); }
  });

  prevButton.addEventListener('click', function () { go(-1); });
  nextButton.addEventListener('click', function () { go(1); });

  // Нажатие в любом месте экрана: левая треть — назад, остальное — вперёд.
  // Кнопки внизу и ссылки на слайдах работают как обычно.
  var swiped = false;
  document.addEventListener('click', function (e) {
    if (swiped) { swiped = false; return; }
    if (e.target.closest('a, .controls')) return;
    go(e.clientX < window.innerWidth * 0.3 ? -1 : 1);
  });

  var startX = 0, startY = 0;
  document.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (e.target.closest && e.target.closest('.controls')) return;
    var dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; go(dx < 0 ? 1 : -1); }
  }, { passive: true });

  var root = document.documentElement;
  var canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  if (!canFullscreen) fullscreenButton.hidden = true;
  function toggleFullscreen() {
    if (!canFullscreen) return;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
  }
  fullscreenButton.addEventListener('click', toggleFullscreen);

  // Кнопки становятся почти прозрачными, если мышь не двигается, — не отвлекают от слайда
  var idleTimer = null;
  function wake() {
    controls.classList.remove('is-idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { controls.classList.add('is-idle'); }, 2500);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach(function (type) { document.addEventListener(type, wake, { passive: true }); });

  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function () { show(slideFromHash(), false); });
  fit();
  show(slideFromHash(), false);
  wake();
})();
</script>
</body>
</html>
